<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mech City</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #101820; color: white; font: 16px system-ui, sans-serif;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 2;
      padding: 10px 14px; border-radius: 12px;
      background: #101820d9; line-height: 1.4; pointer-events: none;
    }
    #controls {
      position: fixed; inset: auto 0 18px; display: flex;
      justify-content: space-between; align-items: end;
      padding: 0 20px; z-index: 3; pointer-events: none;
    }
    .pad { display: grid; grid-template: repeat(2, 58px) / repeat(3, 58px); gap: 5px; }
    button {
      border: 1px solid #ffffff55; border-radius: 14px;
      background: #263746df; color: white; font-size: 22px;
      width: 58px; height: 58px; touch-action: none;
      pointer-events: auto; user-select: none;
    }
    button:active { background: #e85d3f; }
    #smash { width: 82px; height: 82px; border-radius: 50%; font-size: 15px; font-weight: 800; }
    .empty { visibility: hidden; }
    @media (hover: hover) and (pointer: fine) { #controls { opacity: .55; } }
  </style>
</head>
<body>
  <div id="hud">🏙️ MECH CITY<br><span id="score">Buildings smashed: 0</span><br><small>Move: WASD / arrows · Smash: Space</small></div>
  <canvas id="game"></canvas>

  <div id="controls">
    <div class="pad">
      <button class="empty" aria-hidden="true"></button>
      <button data-dir="up" aria-label="Move up">▲</button>
      <button class="empty" aria-hidden="true"></button>
      <button data-dir="left" aria-label="Move left">◀</button>
      <button data-dir="down" aria-label="Move down">▼</button>
      <button data-dir="right" aria-label="Move right">▶</button>
    </div>
    <button id="smash" aria-label="Smash nearby building">SMASH</button>
  </div>

<script>
(() => {
  const canvas = document.querySelector("#game");
  const ctx = canvas.getContext("2d");
  const scoreText = document.querySelector("#score");

  let w, h, dpr;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();

  const world = { width: 2200, height: 1600 };
  const mech = { x: 1100, y: 800, size: 28, speed: 3.2 };
  const keys = new Set();
  const held = new Set();
  let smashed = 0, messageUntil = 0, message = "";

  // Buildings sit between wide, walkable city streets.
  const buildings = [];
  for (let y = 100; y < world.height - 100; y += 230) {
    for (let x = 100; x < world.width - 100; x += 260) {
      buildings.push({
        x: x + 25 + Math.random() * 25,
        y: y + 25 + Math.random() * 25,
        w: 90 + Math.random() * 55,
        h: 90 + Math.random() * 55,
        color: ["#526779", "#78685d", "#536b61", "#655f79"][Math.floor(Math.random() * 4)],
        alive: true
      });
    }
  }

  addEventListener("keydown", e => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
    keys.add(e.key.toLowerCase());
    if (e.key === " ") smash();
  });
  addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

  document.querySelectorAll("[data-dir]").forEach(button => {
    const dir = button.dataset.dir;
    button.addEventListener("pointerdown", e => {
      e.preventDefault(); button.setPointerCapture(e.pointerId); held.add(dir);
    });
    const release = () => held.delete(dir);
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
  });
  document.querySelector("#smash").addEventListener("pointerdown", e => {
    e.preventDefault(); smash();
  });

  function smash() {
    let target = null, best = 125;
    for (const b of buildings) {
      if (!b.alive) continue;
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const distance = Math.hypot(cx - mech.x, cy - mech.y);
      if (distance < best) { best = distance; target = b; }
    }
    if (target) {
      target.alive = false;
      smashed++;
      scoreText.textContent = `Buildings smashed: ${smashed}`;
      message = "CRUNCH!";
      messageUntil = performance.now() + 700;
    } else {
      message = "Get closer to a building!";
      messageUntil = performance.now() + 700;
    }
  }

  function down(dir, ...keyboard) {
    return held.has(dir) || keyboard.some(k => keys.has(k));
  }

  function update() {
    let dx = 0, dy = 0;
    if (down("left", "a", "arrowleft")) dx--;
    if (down("right", "d", "arrowright")) dx++;
    if (down("up", "w", "arrowup")) dy--;
    if (down("down", "s", "arrowdown")) dy++;
    if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }

    mech.x = Math.max(25, Math.min(world.width - 25, mech.x + dx * mech.speed));
    mech.y = Math.max(25, Math.min(world.height - 25, mech.y + dy * mech.speed));
  }

  function draw() {
    const camX = Math.max(0, Math.min(world.width - w, mech.x - w / 2));
    const camY = Math.max(0, Math.min(world.height - h, mech.y - h / 2));

    ctx.fillStyle = "#26353a";
    ctx.fillRect(0, 0, w, h);

    // Street grid
    ctx.fillStyle = "#39464a";
    for (let x = 0; x < world.width; x += 260) ctx.fillRect(x - camX, 0, 180, h);
    for (let y = 0; y < world.height; y += 230) ctx.fillRect(0, y - camY, w, 150);

    // Road markings
    ctx.strokeStyle = "#d5c27a66";
    ctx.lineWidth = 2;
    ctx.setLineDash([18, 18]);
    for (let x = 90; x < world.width; x += 260) {
      ctx.beginPath(); ctx.moveTo(x - camX, 0); ctx.lineTo(x - camX, h); ctx.stroke();
    }
    for (let y = 75; y < world.height; y += 230) {
      ctx.beginPath(); ctx.moveTo(0, y - camY); ctx.lineTo(w, y - camY); ctx.stroke();
    }
    ctx.setLineDash([]);

    // Buildings
    for (const b of buildings) {
      if (!b.alive) {
        ctx.fillStyle = "#514b45";
        ctx.fillRect(b.x - camX, b.y - camY, b.w, b.h);
        ctx.fillStyle = "#8b7760";
        for (let i = 0; i < 5; i++) {
          ctx.fillRect(b.x - camX + Math.random() * b.w, b.y - camY + Math.random() * b.h, 4, 4);
        }
        continue;
      }
      ctx.fillStyle = "#00000055";
      ctx.fillRect(b.x - camX + 7, b.y - camY + 8, b.w, b.h);
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - camX, b.y - camY, b.w, b.h);
      ctx.fillStyle = "#ffffff22";
      ctx.fillRect(b.x - camX + 8, b.y - camY + 8, b.w - 16, 8);
      ctx.fillStyle = "#b9d7d755";
      for (let wx = 12; wx < b.w - 8; wx += 22)
        for (let wy = 22; wy < b.h - 8; wy += 25)
          ctx.fillRect(b.x - camX + wx, b.y - camY + wy, 8, 9);
    }

    // Mech
    const x = mech.x - camX, y = mech.y - camY;
    ctx.fillStyle = "#0008";
    ctx.beginPath(); ctx.ellipse(x, y + 18, 25, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e85d3f";
    ctx.fillRect(x - 17, y - 20, 34, 38);
    ctx.fillStyle = "#f2c14e";
    ctx.fillRect(x - 13, y - 31, 26, 17);
    ctx.fillStyle = "#15232a";
    ctx.fillRect(x - 8, y - 26, 16, 6);
    ctx.fillStyle = "#b5c5c8";
    ctx.fillRect(x - 25, y - 10, 8, 21);
    ctx.fillRect(x + 17, y - 10, 8, 21);
    ctx.fillStyle = "#263746";
    ctx.fillRect(x - 14, y + 17, 10, 10);
    ctx.fillRect(x + 4, y + 17, 10, 10);

    if (performance.now() < messageUntil) {
      ctx.font = "bold 22px system-ui";
      ctx.textAlign = "center";
      ctx.fillStyle = "white";
      ctx.fillText(message, x, y - 48);
    }
  }

  function loop() {
    update(); draw(); requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
