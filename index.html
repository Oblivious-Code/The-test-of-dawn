<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MECHA CITY v3 – Mobile Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body{margin:0;overflow:hidden;font-family:sans-serif;background:#000}
  #hud{position:absolute;top:10px;left:10px;color:#0f0;text-shadow:0 0 6px #000;font-size:18px}
  #wanted{font-size:28px}
  #joystick{position:absolute;bottom:30px;left:30px;width:120px;height:120px;background:rgba(255,255,255,0.15);border-radius:50%;touch-action:none}
  #punch{position:absolute;bottom:50px;right:40px;width:80px;height:80px;background:rgba(255,0,80,0.7);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;touch-action:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="wanted">★☆☆☆☆</div>
  <div id="info">Joystick • PUNCH</div>
</div>
<div id="joystick"></div>
<div id="punch">PUNCH</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- SETUP ----------
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,600);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setSize(innerWidth,innerHeight);
window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};

scene.add(new THREE.AmbientLight(0xffffff,0.75));
const sun=new THREE.DirectionalLight(0xffffff,0.9);sun.position.set(60,90,40);scene.add(sun);

// ---------- MATERIALS ----------
const matMecha=new THREE.MeshLambertMaterial({color:0xff2255});
const matPolice=new THREE.MeshLambertMaterial({color:0x1122aa});
const matCar=new THREE.MeshLambertMaterial({color:0x333333});
const matHuman=new THREE.MeshLambertMaterial({color:0xffcc99});
const matBuilding=new THREE.MeshLambertMaterial({color:0x445566});
const matRoof=new THREE.MeshLambertMaterial({color:0x112233});

// ---------- CITY ----------
function makeBuilding(w,h,d){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),matBuilding));
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w*1.05,1,d*1.05),matRoof);
  roof.position.y=h/2+0.5;g.add(roof);
  return g;
}
for(let x=-70;x<=70;x+=20)for(let z=-70;z<=70;z+=20)if(Math.random()<0.7){
  const h=15+Math.random()*28;
  const b=makeBuilding(10,h,10);
  b.position.set(x,h/2,z);scene.add(b);
}

// ---------- MECHA (detailed) ----------
const mecha=new THREE.Group();
// torso
mecha.add(new THREE.Mesh(new THREE.BoxGeometry(3.5,6,2.8),matMecha));
// head
const head=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.6,2.6),new THREE.MeshLambertMaterial({color:0x222222}));
head.position.y=5;mecha.add(head);
// arms
const armL=new THREE.Mesh(new THREE.BoxGeometry(1.5,5.5,1.5),matMecha);
armL.position.set(-3.8,0,0);mecha.add(armL);
const armR=armL.clone();armR.position.x=3.8;mecha.add(armR);
// legs
const legL=new THREE.Mesh(new THREE.BoxGeometry(1.8,5,2),new THREE.MeshLambertMaterial({color:0x333333}));
legL.position.set(-1.4,-6,0);mecha.add(legL);
const legR=legL.clone();legR.position.x=1.4;mecha.add(legR);
scene.add(mecha);
camera.position.set(0,18,-22);

// ---------- POLICE CARS ----------
const policeCars=[];
function spawnPolice(x,z){
  const car=new THREE.Group();
  car.add(new THREE.Mesh(new THREE.BoxGeometry(4,2,7),matPolice));
  car.add(new THREE.Mesh(new THREE.BoxGeometry(3,1.5,3),new THREE.MeshLambertMaterial({color:0x88aaff})));
  car.position.set(x,1,z);
  scene.add(car);
  policeCars.push(car);
}
for(let i=0;i<8;i++)spawnPolice(-50+Math.random()*100,-50+Math.random()*100);

// ---------- PEOPLE ----------
const people=[];
function spawnPerson(x,z){
  const p=new THREE.Group();
  p.add(new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.6,8),matHuman)); // body
  const headP=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,8),matHuman);
  headP.position.y=1.3;p.add(headP);
  p.position.set(x,0.8,z);
  scene.add(p);
  people.push(p);
}
for(let i=0;i<20;i++)spawnPerson(-60+Math.random()*120,-60+Math.random()*120);

// ---------- WANTED SYSTEM ----------
let stars=0;
const wantedEl=document.getElementById('wanted');
function setStars(n){stars=Math.max(0,Math.min(5,n));wantedEl.innerHTML='★'.repeat(stars)+'☆'.repeat(5-stars);}
function addHeat(v){setStars(stars+v);setTimeout(()=>setStars(stars-1),6000);}

// ---------- JOYSTICK ----------
const joy=document.getElementById('joystick');
let joyActive=false,joyStart={x:0,y:0},joyVec={x:0,y:0};
joy.addEventListener('touchstart',e=>{joyActive=true;const t=e.touches[0];joyStart={x:t.clientX,y:t.clientY};});
joy.addEventListener('touchmove',e=>{if(!joyActive)return;const t=e.touches[0];joyVec.x=(t.clientX-joyStart.x)/60;joyVec.y=(t.clientY-joyStart.y)/60;});
joy.addEventListener('touchend',()=>{joyActive=false;joyVec={x:0,y:0};});

// ---------- PUNCH + DESTRUCTION ----------
const punchBtn=document.getElementById('punch');
punchBtn.addEventListener('touchstart',()=>{
  // punch animation
  const oZ=mecha.position.z;
  mecha.position.z-=3;setTimeout(()=>mecha.position.z=oZ,130);

  // destroy buildings + spawn rubble
  scene.children.slice().forEach(obj=>{
    if(obj.geometry&&obj.position.distanceTo(mecha.position)<15){
      for(let i=0;i<5;i++){
        const r=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.3,1.3),new THREE.MeshLambertMaterial({color:0x666666}));
        r.position.copy(obj.position);
        r.position.x+=(Math.random()-0.5)*5;r.position.y+=Math.random()*4;r.position.z+=(Math.random()-0.5)*5;
        scene.add(r);setTimeout(()=>scene.remove(r),4500);
      }
      scene.remove(obj);addHeat(1);
    }
  });
});

// ---------- TOUCH LOOK ----------
let lastX=0,yaw=0;
document.addEventListener('touchstart',e=>lastX=e.touches[0].clientX);
document.addEventListener('touchmove',e=>{yaw-=(e.touches[0].clientX-lastX)*0.006;lastX=e.touches[0].clientX;});

// ---------- GAME LOOP ----------
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();

  // movement
  const spd=24;
  if(joyActive){
    mecha.position.x+=Math.sin(yaw)*joyVec.x*spd*dt;
    mecha.position.z-=Math.cos(yaw)*joyVec.y*spd*dt;
  }
  mecha.rotation.y=yaw;

  // camera
  const off=new THREE.Vector3(0,16,-21).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
  camera.position.lerp(mecha.position.clone().add(off),0.12);
  camera.lookAt(mecha.position.x,mecha.position.y+7,mecha.position.z);

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
