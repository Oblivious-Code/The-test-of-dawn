DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MECHA CITY – GTA6 Style Sandbox</title>
<style>
  body{margin:0;overflow:hidden;font-family:sans-serif}
  #hud{position:absolute;top:20px;left:20px;color:white;text-shadow:0 0 4px #000}
  #wanted{font-size:32px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="wanted">★☆☆☆☆</div>
  <div id="info">WASD move • Space jump • Mouse look • E punch</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- THREE.JS SETUP ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
window.onresize = () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};

// ---------- LIGHT ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(50,100,50);
scene.add(dir);

// ---------- CITY (medium scale) ----------
const cityMat = new THREE.MeshLambertMaterial({color:0x555555});
const buildingGeo = new THREE.BoxGeometry(8,20,8);
for(let x=-40;x<=40;x+=16){
  for(let z=-40;z<=40;z+=16){
    if(Math.random()<0.6){
      const h = 15+Math.random()*25;
      const b = new THREE.Mesh(buildingGeo, cityMat);
      b.position.set(x,h/2,z);
      b.scale.y = h/20;
      scene.add(b);
    }
  }
}

// ---------- MECHA (simple anime style) ----------
const mecha = new THREE.Group();
const torso = new THREE.Mesh(new THREE.BoxGeometry(3,5,2), new THREE.MeshLambertMaterial({color:0xff3366}));
const head  = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshLambertMaterial({color:0x222222}));
head.position.y = 4;
mecha.add(torso, head);
scene.add(mecha);
camera.position.set(0,12,-20);
camera.lookAt(mecha.position);

// ---------- CONTROLS ----------
let keys={}, yaw=0, pitch=0;
document.onkeydown = e=>keys[e.key.toLowerCase()]=true;
document.onkeyup   = e=>keys[e.key.toLowerCase()]=false;
let mouseDown=false;
document.onmousedown = ()=>{mouseDown=true; document.body.requestPointerLock();};
document.onmouseup   = ()=>mouseDown=false;
document.onmousemove = e=>{
  if(!mouseDown) return;
  yaw   -= e.movementX*0.002;
  pitch  = Math.max(-1.2, Math.min(1.2, pitch - e.movementY*0.002));
};

// ---------- WANTED SYSTEM ----------
let stars = 0;
const wantedEl = document.getElementById('wanted');
function updateWanted(newStars){
  stars = Math.min(5, newStars);
  wantedEl.innerHTML = '★'.repeat(stars) + '☆'.repeat(5-stars);
}

// simple heat: punching buildings raises heat
function addHeat(amount){
  updateWanted(Math.ceil(stars + amount));
  setTimeout(()=>updateWanted(Math.max(0,stars-1)), 8000);
}

// ---------- ANIMATION LOOP ----------
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // movement
  const speed = 18;
  if(keys['w']) mecha.position.z -= Math.cos(yaw)*speed*dt;
  if(keys['s']) mecha.position.z += Math.cos(yaw)*speed*dt;
  if(keys['a']) mecha.position.x -= Math.sin(yaw)*speed*dt;
  if(keys['d']) mecha.position.x += Math.sin(yaw)*speed*dt;
  if(keys[' ']) mecha.position.y = Math.min(mecha.position.y+25*dt, 25);
  else mecha.position.y = Math.max(mecha.position.y-30*dt, 0);

  mecha.rotation.y = yaw;

  // camera follow
  const camOffset = new THREE.Vector3(0,12,-22).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  camera.position.lerp(mecha.position.clone().add(camOffset), 0.1);
  camera.lookAt(mecha.position.x, mecha.position.y+6, mecha.position.z);

  // punch (E)
  if(keys['e']){
    keys['e']=false;
    // simple hit test
    scene.children.forEach(obj=>{
      if(obj.geometry && obj.position.distanceTo(mecha.position)<12){
        scene.remove(obj);
        addHeat(1);
      }
    });
  }

  renderer.render(scene, camera);
}
animate();

// ---------- TOUCH / MOBILE ----------
let touchStartX=0;
document.addEventListener('touchstart',e=>{
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchmove',e=>{
  const dx = e.touches[0].clientX - touchStartX;
  yaw -= dx*0.005;
  touchStartX = e.touches[0].clientX;
});
</script>
</body>
</html>
