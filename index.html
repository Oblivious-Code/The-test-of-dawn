<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Neon Mech City</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101426;
      color: white;
      font: 15px system-ui, sans-serif;
      touch-action: none;
    }

    canvas { display: block; }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 2;
      padding: 11px 15px;
      border: 1px solid #88e7ff55;
      border-radius: 12px;
      background: #101426d9;
      box-shadow: 0 0 20px #31bde033;
      line-height: 1.45;
      pointer-events: none;
    }

    #title {
      color: #7deaff;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    #controls {
      position: fixed;
      inset: auto 0 18px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: end;
      padding: 0 20px;
      pointer-events: none;
    }

    #joystick {
      position: relative;
      width: 140px;
      height: 140px;
      border: 2px solid #a9efff77;
      border-radius: 50%;
      background: #142334b8;
      box-shadow: inset 0 0 20px #4fdcff22, 0 0 18px #4fdcff22;
      touch-action: none;
      pointer-events: auto;
      user-select: none;
    }

    #stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 56px;
      border: 1px solid #ffffffaa;
      border-radius: 50%;
      background: linear-gradient(145deg, #e8fbff, #70cce5);
      box-shadow: 0 0 14px #70cce599;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    button {
      width: 84px;
      height: 84px;
      border: 2px solid #ffd0aa;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff835c, #bb3544);
      box-shadow: 0 0 18px #ff534c66;
      color: white;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      touch-action: none;
      user-select: none;
      pointer-events: auto;
    }

    button:active { filter: brightness(1.35); }

    @media (max-height: 500px) {
      #joystick { width: 112px; height: 112px; }
      #stick { width: 48px; height: 48px; }
      button { width: 70px; height: 70px; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="title">NEON MECH CITY</div>
    <span id="score">Buildings smashed: 0</span><br>
    <small>Joystick to move · WASD/arrows · Space to smash</small>
  </div>

  <div id="controls">
    <div id="joystick" aria-label="Movement joystick">
      <div id="stick"></div>
    </div>
    <button id="smash" aria-label="Smash nearby building">SMASH</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101426);
    scene.fog = new THREE.Fog(0x101426, 80, 150);

    const camera = new THREE.PerspectiveCamera(
      57, innerWidth / innerHeight, 0.1, 220
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x9bcaff, 0x202035, 1.8));

    const moonlight = new THREE.DirectionalLight(0xb9dfff, 2.2);
    moonlight.position.set(-28, 48, 22);
    moonlight.castShadow = true;
    moonlight.shadow.mapSize.set(1024, 1024);
    scene.add(moonlight);

    const pinkLight = new THREE.PointLight(0xff3f9b, 32, 48);
    pinkLight.position.set(0, 9, -12);
    scene.add(pinkLight);

    const cyanLight = new THREE.PointLight(0x35d9ff, 28, 48);
    cyanLight.position.set(10, 8, 10);
    scene.add(cyanLight);

    // Dark city ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(130, 130),
      new THREE.MeshStandardMaterial({
        color: 0x242936,
        roughness: 0.88,
        metalness: 0.12
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.08;
    ground.receiveShadow = true;
    scene.add(ground);

    // Road strips and dashed lane markings
    const roadMaterial = new THREE.MeshStandardMaterial({
      color: 0x171c29,
      roughness: 0.95
    });
    const stripeMaterial = new THREE.MeshBasicMaterial({ color: 0xb9b879 });

    for (const road of [-30, -10, 10, 30]) {
      const roadX = new THREE.Mesh(
        new THREE.BoxGeometry(7, 0.025, 130), roadMaterial
      );
      roadX.position.set(road, -0.035, 0);
      scene.add(roadX);

      const roadZ = new THREE.Mesh(
        new THREE.BoxGeometry(130, 0.025, 7), roadMaterial
      );
      roadZ.position.set(0, -0.034, road);
      scene.add(roadZ);

      for (let p = -58; p <= 58; p += 12) {
        const dashX = new THREE.Mesh(
          new THREE.BoxGeometry(0.14, 0.035, 3), stripeMaterial
        );
        dashX.position.set(road, 0, p);
        scene.add(dashX);

        const dashZ = new THREE.Mesh(
          new THREE.BoxGeometry(3, 0.035, 0.14), stripeMaterial
        );
        dashZ.position.set(p, 0.001, road);
        scene.add(dashZ);
      }
    }

    // Decorative distant stars
    const starPositions = [];
    for (let i = 0; i < 180; i++) {
      starPositions.push(
        (Math.random() - 0.5) * 180,
        28 + Math.random() * 60,
        (Math.random() - 0.5) * 180
      );
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(starPositions, 3)
    );
    scene.add(new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({
        color: 0xc4eaff,
        size: 0.35,
        sizeAttenuation: true
      })
    ));

    const buildings = [];
    const buildingColors = [
      0x39465f, 0x46536b, 0x51455f, 0x3e5863, 0x66504f
    ];
    const windowMaterial = new THREE.MeshStandardMaterial({
      color: 0x83e8ff,
      emissive: 0x34cfff,
      emissiveIntensity: 1.4,
      roughness: 0.35
    });

    function addWindowGrid(group, width, height, depth) {
      const windowWidth = 0.65;
      const windowHeight = 0.85;
      const columns = Math.max(2, Math.floor(width / 1.7));
      const rows = Math.max(2, Math.floor(height / 2.3));
      const windows = new THREE.InstancedMesh(
        new THREE.BoxGeometry(windowWidth, windowHeight, 0.1),
        windowMaterial,
        columns * rows * 2
      );

      const dummy = new THREE.Object3D();
      let index = 0;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
          const x = -width / 2 + (col + 0.5) * width / columns;
          const y = 1.5 + row * 2.1;

          // Front and back window faces
          dummy.position.set(x, y, -depth / 2 - 0.055);
          dummy.rotation.set(0, 0, 0);
          dummy.updateMatrix();
          windows.setMatrixAt(index++, dummy.matrix);

          dummy.position.set(x, y, depth / 2 + 0.055);
          dummy.rotation.set(0, Math.PI, 0);
          dummy.updateMatrix();
          windows.setMatrixAt(index++, dummy.matrix);
        }
      }

      group.add(windows);
    }

    function createBuilding(x, z) {
      const width = 8 + Math.random() * 3;
      const depth = 8 + Math.random() * 3;
      const height = 10 + Math.random() * 19;

      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        new THREE.MeshStandardMaterial({
          color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
          roughness: 0.72,
          metalness: 0.18
        })
      );
      body.position.y = height / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      addWindowGrid(group, width, height, depth);

      const trimMaterial = new THREE.MeshStandardMaterial({
        color: 0x39dfff,
        emissive: 0x13bfff,
        emissiveIntensity: 1.7
      });

      // Glowing vertical corner accents
      for (const sideX of [-1, 1]) {
        const trim = new THREE.Mesh(
          new THREE.BoxGeometry(0.12, height, 0.14),
          trimMaterial
        );
        trim.position.set(sideX * (width / 2 + 0.04), height / 2, -depth / 2 - 0.05);
        group.add(trim);
      }

      // Small rooftop structures
      const rooftop = new THREE.Mesh(
        new THREE.BoxGeometry(width * 0.35, 1.2, depth * 0.35),
        new THREE.MeshStandardMaterial({ color: 0x252d3b, roughness: 0.8 })
      );
      rooftop.position.set(0, height + 0.6, 0);
      rooftop.castShadow = true;
      group.add(rooftop);

      scene.add(group);
      group.userData = {
        alive: true, x, z, width, depth, height
      };
      buildings.push(group);
    }

    for (const x of [-40, -20, 20, 40]) {
      for (const z of [-40, -20, 20, 40]) {
        createBuilding(x, z);
      }
    }

    // Street lamps
    const lampPoleMaterial = new THREE.MeshStandardMaterial({
      color: 0x333c4c,
      metalness: 0.7,
      roughness: 0.35
    });
    const lampGlowMaterial = new THREE.MeshStandardMaterial({
      color: 0xc6f9ff,
      emissive: 0x52dfff,
      emissiveIntensity: 2.5
    });

    for (const [x, z] of [[-6,-6], [6,-6], [-6,6], [6,6], [0,-27], [27,0]]) {
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.09, 0.14, 5, 8),
        lampPoleMaterial
      );
      pole.position.set(x, 2.5, z);
      pole.castShadow = true;
      scene.add(pole);

      const lamp = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 10, 8),
        lampGlowMaterial
      );
      lamp.position.set(x, 5.1, z);
      scene.add(lamp);

      const light = new THREE.PointLight(0x57dfff, 7, 12);
      light.position.set(x, 5, z);
      scene.add(light);
    }

    // Build the mech from layered armor pieces
    const mech = new THREE.Group();
    scene.add(mech);

    function boxPart(parent, size, color, position, materialOptions = {}) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(...size),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.45,
          metalness: 0.35,
          ...materialOptions
        })
      );
      mesh.position.set(...position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function spherePart(parent, radius, color, position, emissive = 0x000000) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 16, 12),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.38,
          metalness: 0.45,
          emissive,
          emissiveIntensity: 1.5
        })
      );
      mesh.position.set(...position);
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    boxPart(mech, [2.0, 1.65, 1.25], 0x293b51, [0, 2.05, 0]);
    boxPart(mech, [1.35, 0.82, 1.0], 0xe8a543, [0, 3.3, 0]);
    boxPart(mech, [0.96, 0.2, 0.12], 0x8cf4ff, [0, 3.35, -0.53], {
      emissive: 0x25dfff,
      emissiveIntensity: 2
    });

    // Chest plate and glowing reactor
    boxPart(mech, [1.05, 0.52, 0.14], 0xe85d47, [0, 2.24, -0.66]);
    spherePart(mech, 0.23, 0x7af4ff, [0, 2.18, -0.79], 0x26cfff);

    // Shoulders, arms and joints
    boxPart(mech, [0.9, 0.65, 0.9], 0xe85d47, [-1.35, 2.55, 0]);
    boxPart(mech, [0.9, 0.65, 0.9], 0xe85d47, [1.35, 2.55, 0]);
    spherePart(mech, 0.32, 0xaec5d1, [-1.32, 2.0, 0]);
    spherePart(mech, 0.32, 0xaec5d1, [1.32, 2.0, 0]);
    boxPart(mech, [0.58, 1.15, 0.62], 0x718898, [-1.35, 1.42, 0]);
    boxPart(mech, [0.58, 1.15, 0.62], 0x718898, [1.35, 1.42, 0]);

    // Legs and heavy feet
    boxPart(mech, [0.72, 1.05, 0.75], 0x38495f, [-0.48, 0.85, 0]);
    boxPart(mech, [0.72, 1.05, 0.75], 0x38495f, [0.48, 0.85, 0]);
    boxPart(mech, [0.88, 0.35, 1.15], 0x242e40, [-0.48, 0.22, -0.12]);
    boxPart(mech, [0.88, 0.35, 1.15], 0x242e40, [0.48, 0.22, -0.12]);

    // Small glowing shoulder lights
    spherePart(mech, 0.12, 0xffd86b, [-1.35, 2.62, -0.47], 0xffa500);
    spherePart(mech, 0.12, 0xffd86b, [1.35, 2.62, -0.47], 0xffa500);

    const keys = new Set();
    let joyX = 0;
    let joyY = 0;
    let joystickPointer = null;

    // Camera keeps a steady heading so joystick directions never flip.
    const cameraYaw = 0;

    addEventListener("keydown", event => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
        event.preventDefault();
      }
      keys.add(event.key.toLowerCase());
      if (event.key === " ") smash();
    });

    addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));

    const joystick = document.querySelector("#joystick");
    const stick = document.querySelector("#stick");

    function moveJoystick(event) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = event.clientX - centerX;
      let dy = event.clientY - centerY;

      const maxRadius = 44;
      const distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = dx / distance * maxRadius;
        dy = dy / distance * maxRadius;
      }

      joyX = dx / maxRadius;
      joyY = dy / maxRadius;
      stick.style.left = `${50 + dx / maxRadius * 34}%`;
      stick.style.top = `${50 + dy / maxRadius * 34}%`;
    }

    function resetJoystick() {
      joyX = 0;
      joyY = 0;
      joystickPointer = null;
      stick.style.left = "50%";
      stick.style.top = "50%";
    }

    joystick.addEventListener("pointerdown", event => {
      event.preventDefault();
      joystickPointer = event.pointerId;
      joystick.setPointerCapture(event.pointerId);
      moveJoystick(event);
    });

    joystick.addEventListener("pointermove", event => {
      if (event.pointerId === joystickPointer) moveJoystick(event);
    });

    joystick.addEventListener("pointerup", resetJoystick);
    joystick.addEventListener("pointercancel", resetJoystick);

    document.querySelector("#smash").addEventListener("pointerdown", event => {
      event.preventDefault();
      smash();
    });

    let smashed = 0;

    function smash() {
      let target = null;
      let nearest = 10;

      for (const building of buildings) {
        if (!building.userData.alive) continue;

        const distance = Math.hypot(
          building.position.x - mech.position.x,
          building.position.z - mech.position.z
        );

        if (distance < nearest) {
          nearest = distance;
          target = building;
        }
      }

      if (!target) return;

      target.userData.alive = false;
      target.visible = false;

      // Leave a low rubble pile where the building stood.
      const rubble = new THREE.Group();
      const rubbleMaterial = new THREE.MeshStandardMaterial({
        color: 0x625b61,
        roughness: 1
      });

      for (let i = 0; i < 9; i++) {
        const chunk = new THREE.Mesh(
          new THREE.BoxGeometry(
            1 + Math.random() * 2.4,
            0.5 + Math.random() * 1.1,
            1 + Math.random() * 2.4
          ),
          rubbleMaterial
        );
        chunk.position.set(
          (Math.random() - 0.5) * target.userData.width,
          0.25 + Math.random() * 0.45,
          (Math.random() - 0.5) * target.userData.depth
        );
        chunk.rotation.y = Math.random() * Math.PI;
        chunk.castShadow = true;
        rubble.add(chunk);
      }

      rubble.position.set(target.userData.x, 0, target.userData.z);
      scene.add(rubble);

      smashed++;
      document.querySelector("#score").textContent =
        `Buildings smashed: ${smashed}`;
    }

    function update() {
      // Inputs are relative to the camera view:
      // joystick up is forward, and joystick left is always left.
      let forwardInput = -joyY;
      let strafeInput = joyX;

      if (keys.has("w") || keys.has("arrowup")) forwardInput += 1;
      if (keys.has("s") || keys.has("arrowdown")) forwardInput -= 1;
      if (keys.has("a") || keys.has("arrowleft")) strafeInput -= 1;
      if (keys.has("d") || keys.has("arrowright")) strafeInput += 1;

      const forwardX = -Math.sin(cameraYaw);
      const forwardZ = -Math.cos(cameraYaw);
      const rightX = Math.cos(cameraYaw);
      const rightZ = -Math.sin(cameraYaw);

      let dx = forwardX * forwardInput + rightX * strafeInput;
      let dz = forwardZ * forwardInput + rightZ * strafeInput;

      const length = Math.hypot(dx, dz);
      if (length > 1) {
        dx /= length;
        dz /= length;
      }

      const speed = 0.16;
      const nextX = THREE.MathUtils.clamp(mech.position.x + dx * speed, -58, 58);
      const nextZ = THREE.MathUtils.clamp(mech.position.z + dz * speed, -58, 58);

      function blocked(x, z) {
        return buildings.some(building => {
          if (!building.userData.alive) return false;

          return Math.abs(x - building.position.x) <
                   building.userData.width / 2 + 1.2 &&
                 Math.abs(z - building.position.z) <
                   building.userData.depth / 2 + 1.2;
        });
      }

      if (!blocked(nextX, mech.position.z)) mech.position.x = nextX;
      if (!blocked(mech.position.x, nextZ)) mech.position.z = nextZ;

      // Face the direction of travel.
      if (Math.hypot(dx, dz) > 0.08) {
        mech.rotation.y = Math.atan2(-dx, -dz);
      }

      // Follow the mech's position while keeping a stable view direction.
      const followDistance = 19;
      const cameraTarget = new THREE.Vector3(
        mech.position.x + Math.sin(cameraYaw) * followDistance,
        13,
        mech.position.z + Math.cos(cameraYaw) * followDistance
      );

      camera.position.lerp(cameraTarget, 0.09);
      camera.lookAt(mech.position.x, 1.8, mech.position.z);

      // Gentle mech idle/movement bob
      mech.position.y = Math.sin(performance.now() * 0.006) * 0.035;
    }

    camera.position.set(0, 13, 19);

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    });
  </script>
</body>
</html>
