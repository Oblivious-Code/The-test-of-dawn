<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IRON HORIZON: Mech City</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050510;font-family:'Segoe UI',Arial,sans-serif;color:#e0f7ff;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;z-index:0}
#hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;z-index:4;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}
.label{font-size:12px;letter-spacing:2px;text-shadow:0 0 6px #0ff;margin-top:6px}
.bar{width:170px;height:10px;background:#111;border:1px solid #0ff;border-radius:4px;overflow:hidden;margin-top:4px}
.fill{height:100%;width:100%;transition:width .15s}
#hp{background:#ff2d75}
#en{background:#0ff}
#score{font-size:24px;color:#ff2d75;text-shadow:0 0 10px #ff2d75}
#lookZone{position:fixed;top:0;right:0;width:55%;height:100%;z-index:2}
.btn{position:fixed;width:84px;height:84px;border-radius:50%;border:2px solid #0ff;background:rgba(0,255,255,.12);color:#0ff;display:flex;align-items:center;justify-content:center;font-weight:bold;letter-spacing:1px;z-index:5;box-shadow:0 0 12px rgba(0,255,255,.4)}
#fire{right:20px;bottom:20px;border-color:#ff2d75;color:#ff2d75;background:rgba(255,45,117,.15);box-shadow:0 0 12px rgba(255,45,117,.5)}
#jump{right:118px;bottom:30px}
#boost{right:20px;bottom:118px;border-color:#b14dff;color:#b14dff;background:rgba(177,77,255,.15)}
#joy{position:fixed;left:20px;bottom:20px;width:130px;height:130px;border-radius:50%;border:2px solid rgba(0,255,255,.5);background:rgba(0,255,255,.07);z-index:5}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(0,255,255,.35);border:2px solid #0ff;transform:translate(-50%,-50%)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,16,.88);z-index:20;padding:20px;text-align:center}
h1{font-size:clamp(26px,7vw,52px);color:#0ff;text-shadow:0 0 14px #0ff,0 0 30px #f0f;letter-spacing:4px;margin-bottom:8px}
.sub{font-size:13px;letter-spacing:2px;color:#f0f;margin-bottom:24px}
#cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px}
.card{width:240px;background:rgba(10,10,30,.9);border:1px solid #0ff;border-radius:10px;padding:14px;color:#e0f7ff;cursor:pointer;text-align:left;font-family:inherit;box-shadow:0 0 14px rgba(0,255,255,.25)}
.card:hover,.card:active{border-color:#f0f;box-shadow:0 0 20px rgba(255,0,255,.5)}
.card h3{color:#0ff;font-size:17px;margin-bottom:2px}
.card .role{color:#f0f;font-size:12px;letter-spacing:1px;margin-bottom:6px}
.card p{font-size:12px;opacity:.8;margin-bottom:8px}
.srow{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:4px}
.srow span:first-child{width:58px}
.sbar{flex:1;height:6px;background:#111;border-radius:3px;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#0ff,#f0f)}
#over .big{font-size:28px;color:#ff2d75;text-shadow:0 0 12px #ff2d75;margin-bottom:12px}
button.start{margin-top:20px;padding:12px 28px;background:transparent;border:2px solid #f0f;color:#f0f;font-size:16px;letter-spacing:2px;border-radius:6px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="hud">
  <div>
    <div class="label" id="mechName">SELECT A MECH</div>
    <div class="label">ARMOUR</div>
    <div class="bar"><div class="fill" id="hp"></div></div>
    <div class="label">ENERGY</div>
    <div class="bar"><div class="fill" id="en"></div></div>
  </div>
  <div id="score">0</div>
</div>

<div id="lookZone"></div>
<div id="joy"><div id="knob"></div></div>
<div id="fire" class="btn">FIRE</div>
<div id="jump" class="btn">JUMP</div>
<div id="boost" class="btn">BOOST</div>

<div id="title" class="overlay">
  <h1>IRON HORIZON</h1>
  <div class="sub">MECH CITY</div>
  <div id="cards"></div>
</div>

<div id="over" class="overlay" style="display:none">
  <div class="big">MECH DESTROYED</div>
  <div id="finalScore" style="margin-bottom:8px"></div>
  <button class="start" id="restart">RETURN TO HANGAR</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const MECHS = {
  vanguard:{name:'Vanguard MK-I',role:'ALL-ROUNDER',desc:'Balanced armour and firepower. A solid first pick.',armour:100,speed:9,fire:18,energy:100,color:0x00ffff},
  ravager:{name:'Ravager X',role:'HEAVY ASSAULT',desc:'Tanky and hard-hitting, but slow on its feet.',armour:160,speed:6,fire:30,energy:80,color:0xff2d75},
  strike:{name:'Strikeshade',role:'STEALTH STRIKER',desc:'Fast and agile, but fragile under fire.',armour:70,speed:12,fire:12,energy:120,color:0xb14dff}
};
const MAX = {armour:160,speed:12,fire:30,energy:120};

let mech=MECHS.vanguard, running=false, score=0, yaw=0;
let P=null, mechGroup=null, respawnTimer=0;
const enemies=[], shots=[];
const held={};
const input={jumpQueued:false,fireHeld:false,boostHeld:false};
let joyVec={x:0,y:0}, joyId=null, joyCenter={x:0,y:0};
let lookId=null, lastLookX=0;

// ---------- Renderer & scene ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050510);
scene.fog=new THREE.Fog(0x050510,40,170);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,320);
camera.position.set(0,6,12);
camera.lookAt(0,1,0);

scene.add(new THREE.AmbientLight(0x404070,1.3));
const sun=new THREE.DirectionalLight(0xff77cc,0.8);
sun.position.set(-30,50,20);
scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x0a0a18,roughness:0.9}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);
const grid=new THREE.GridHelper(400,80,0x00ffff,0x102030);
grid.position.y=0.02;
scene.add(grid);

// ---------- City ----------
const colliders=[];
const neon=[0x00ffff,0xff2d75,0xb14dff,0xffd700];
for(let i=0;i<140;i++){
  const w=3+Math.random()*6, d=3+Math.random()*6, h=4+Math.random()*30;
  const x=(Math.random()-0.5)*340, z=(Math.random()-0.5)*340;
  if(Math.hypot(x,z)<14) continue;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:0x101025,roughness:0.6,metalness:0.3}));
  b.position.set(x,h/2,z);
  scene.add(b);
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(b.geometry),new THREE.LineBasicMaterial({color:neon[i%neon.length]}));
  edges.position.copy(b.position);
  scene.add(edges);
  colliders.push({x,z,hw:w/2+0.8,hd:d/2+0.8});
}

// ---------- Mech model (front faces +z) ----------
function buildMech(color){
  const g=new THREE.Group();
  const armor=new THREE.MeshStandardMaterial({color:0x2a2a44,metalness:0.7,roughness:0.35});
  const glow=new THREE.MeshBasicMaterial({color});
  const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);};
  add(new THREE.BoxGeometry(0.9,0.5,0.8),armor,0,2.3,0);
  add(new THREE.BoxGeometry(0.6,2.2,0.7),armor,-0.45,1.1,0);
  add(new THREE.BoxGeometry(0.6,2.2,0.7),armor,0.45,1.1,0);
  add(new THREE.BoxGeometry(1.7,1.7,1.2),armor,0,3.4,0);
  add(new THREE.BoxGeometry(0.8,0.6,0.7),armor,0,4.6,0);
  add(new THREE.BoxGeometry(0.6,0.14,0.05),glow,0,4.6,0.36);
  add(new THREE.BoxGeometry(0.5,0.5,0.05),glow,0,3.4,0.61);
  add(new THREE.BoxGeometry(0.6,1.9,0.6),armor,-1.2,3.2,0);
  add(new THREE.BoxGeometry(0.6,1.9,0.6),armor,1.2,3.2,0);
  return g;
}

// ---------- Enemies & shots ----------
function spawnEnemy(){
  const m=new THREE.Mesh(new THREE.OctahedronGeometry(1.1),new THREE.MeshStandardMaterial({color:0x330011,emissive:0xff2d75,emissiveIntensity:1.4}));
  const a=Math.random()*Math.PI*2, r=40+Math.random()*60;
  m.position.set(P.pos.x+Math.cos(a)*r,3,P.pos.z+Math.sin(a)*r);
  scene.add(m);
  enemies.push({mesh:m,hp:40,speed:3.5+Math.random()*2,phase:Math.random()*6});
}

function spawnShot(){
  const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8),new THREE.MeshBasicMaterial({color:mech.color}));
  m.position.set(P.pos.x+fx*1.4,P.pos.y+3.2,P.pos.z+fz*1.4);
  scene.add(m);
  shots.push({mesh:m,vel:new THREE.Vector3(fx*70,1,fz*70),life:1.6});
}

// ---------- Game logic ----------
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

function update(dt){
  // Input
  const kx=((held.KeyD||held.ArrowRight)?1:0)-((held.KeyA||held.ArrowLeft)?1:0);
  const ky=((held.KeyS||held.ArrowDown)?1:0)-((held.KeyW||held.ArrowUp)?1:0);
  const mx=clamp(joyVec.x+kx,-1,1), my=clamp(joyVec.y+ky,-1,1);
  const moving=Math
